plugins { id 'com.android.application' }
android {
    namespace 'com.swir.stream'
    testBuildType providers.gradleProperty('testBuildType').getOrElse('debug')
    compileSdk { version = release(36) { minorApiLevel = 1 } }
    defaultConfig {
        applicationId 'com.swir.stream'
        minSdk 23
        targetSdk 36
        versionCode 11
        versionName '0.3.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}
dependencies {
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}

// AGP 9.0.1 shrinks the test APK's j$ support independently. Instrumentation loads
// that copy first, so it must retain the APIs used by the unchanged target APK too.
afterEvaluate {
    if (providers.gradleProperty('testBuildType').getOrElse('debug') == 'release') {
        def targetL8 = tasks.named('l8DexDesugarLibRelease', com.android.build.gradle.internal.tasks.L8DexDesugarLibTask)
        tasks.named('l8DexDesugarLibReleaseAndroidTest', com.android.build.gradle.internal.tasks.L8DexDesugarLibTask).configure {
            dependsOn(targetL8)
            keepRulesConfigurations.add(providers.fileContents(targetL8.flatMap { it.keepRules }).asText)
        }
    }
}
